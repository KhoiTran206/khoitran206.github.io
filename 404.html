<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Không tìm thấy trang | Minh Khôi PC</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/logo/logo-mark.svg?v=2" type="image/svg+xml">
  <!-- Trang 404 tự chứa CSS vì GitHub Pages có thể phục vụ nó ở bất kỳ đường dẫn nào -->
  <style>
    :root { --primary: #E30019; --primary-dark: #B80014; --text: #111111; --muted: #6D6E72; --bg: #F3F3F3; --surface: #FFFFFF; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
    .box { max-width: 480px; padding: 40px 24px; border-radius: 12px; background: var(--surface); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08); }
    .code { font-size: 88px; font-weight: 800; line-height: 1; color: var(--primary); }
    h1 { margin: 12px 0 8px; font-size: 22px; }
    p { color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 24px; }
    a { display: inline-block; padding: 12px 20px; border-radius: 6px; font-weight: 600; text-decoration: none; transition: background 0.25s ease, transform 0.25s ease; }
    a:hover { transform: translateY(-1px); }
    .primary { background: var(--primary); color: #FFFFFF; }
    .primary:hover { background: var(--primary-dark); }
    .outline { border: 1px solid var(--primary); color: var(--primary); }
    .outline:hover { background: #FFE8EA; }
    a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="box">
    <p class="code">404</p>
    <h1>Không tìm thấy trang bạn yêu cầu</h1>
    <p>Trang có thể đã được di chuyển hoặc đường dẫn không đúng.</p>
    <div class="actions">
      <a class="primary" id="home-link" href="/">Về trang chủ Minh Khôi PC</a>
      <a class="outline" href="tel:0937805704">Gọi 0937 805 704</a>
    </div>
  </main>
</body>
</html>
