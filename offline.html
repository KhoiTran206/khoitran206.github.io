<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Không có kết nối | Minh Khôi PC</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#E30019">
  <link rel="icon" href="assets/logo/logo-mark.svg?v=2" type="image/svg+xml">
  <!-- Trang hiện khi app/website mất mạng (do sw.js trả về). Tự chứa CSS vì lúc này có thể không tải được file khác. -->
  <style>
    :root { --primary: #E30019; --primary-dark: #B80014; --primary-light: #FFE8EA; --text: #111111; --muted: #6D6E72; --bg: #F3F3F3; --surface: #FFFFFF; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
    .box { width: 100%; max-width: 420px; padding: 36px 24px; border-radius: 16px; background: var(--surface); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08); }
    .logo { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 16px; }
    .icon { width: 72px; height: 72px; display: grid; place-items: center; margin: 0 auto 16px; border-radius: 50%; background: var(--primary-light); color: var(--primary); }
    h1 { margin-bottom: 8px; font-size: 22px; }
    p { color: var(--muted); line-height: 1.5; }
    .actions { display: grid; gap: 8px; margin-top: 24px; }
    button, a { display: block; padding: 14px 20px; border: 0; border-radius: 8px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; transition: background 0.25s ease, transform 0.25s ease; }
    button { background: var(--primary); color: #FFFFFF; }
    button:hover { background: var(--primary-dark); transform: translateY(-1px); }
    a { border: 1px solid var(--primary); color: var(--primary); }
    a:hover { background: var(--primary-light); }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="box">
    <span class="icon" aria-hidden="true">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></svg>
    </span>
    <h1>Không có kết nối mạng</h1>
    <p>Vui lòng kiểm tra Wi-Fi hoặc 4G rồi thử lại. Giỏ hàng của bạn vẫn được giữ nguyên.</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">Thử lại</button>
      <a href="tel:0937805704">Gọi Minh Khôi PC: 0937 805 704</a>
    </div>
  </main>
</body>
</html>
